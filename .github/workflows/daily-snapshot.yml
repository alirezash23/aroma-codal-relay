name: Daily Codal snapshot

# منبع فعلی فقط تلگرام است — کدال از هیچ سرور ابری (نه گیت‌هاب، نه لیارا
# حتی build-در-ایران) در دسترس نیست. تلگرام برخلاف کدال از گیت‌هاب هم
# جواب می‌دهد (تست 1405/05/26 را با موفقیت گذراند)، پس این اجرای
# زمان‌بندی‌شده دوباره فعال است.
on:
  schedule:
    - cron: "30 6 * * 0-4"   # 10:00 تهران
  workflow_dispatch:
    inputs:
      days:
        description: "چند روز گذشته"
        default: "1"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run snapshot
        run: python snapshot.py --days ${{ github.event.inputs.days || 3 }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          git push
