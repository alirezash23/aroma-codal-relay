name: Daily Codal snapshot

on:
  schedule:
    # 06:30 UTC = 10:00 تهران
    - cron: "30 6 * * 0-4"
  workflow_dispatch:
    inputs:
      days:
        description: "چند روز گذشته"
        default: "1"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run snapshot
        run: python snapshot.py --days ${{ github.event.inputs.days || 1 }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          git push
